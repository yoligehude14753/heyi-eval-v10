[project]
name = "heyi-eval-v10"
version = "0.1.0"
description = "Automated model evaluation pipeline for nv8-6000 (heyi-sh-nv8). v10 = post-incident architecture rewrite."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "huggingface-hub>=0.24.0,<0.30.0",
  "docker>=7.1.0,<8.0.0",
  "PyYAML>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-PyYAML",
  "types-requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Top-level Python packages. cc-agent is omitted (it's a Docker entrypoint, not importable Python).
# backup/ and deploy/ may be added in later PRs.
packages = ["discover", "curator", "orchestrator", "panel"]
include-package-data = true

[tool.setuptools.package-data]
discover = ["whitelist.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",       # pycodestyle + pyflakes
  "I",                 # isort
  "B",                 # flake8-bugbear
  "UP",                # pyupgrade
  "SIM",               # simplify
  "RUF",               # ruff-specific
]
ignore = [
  "E501",              # line-too-long (rely on formatter)
  # CJK punctuation false positives. The project's docstrings and Chinese
  # comments deliberately use full-width parens / colons / semicolons.
  "RUF001", "RUF002", "RUF003",
  # Style preferences deferred to PR#3 (orchestrator rewrite). The legacy
  # v9 code uses try/except/pass and (str, Enum) inheritance widely; we
  # migrate as-is in PR#1 and modernize in the rewrite PR.
  "UP042",             # StrEnum migration
  "SIM105",            # contextlib.suppress preference
  "SIM108",            # ternary if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_return_any = true
show_error_codes = true
disallow_any_unimported = false      # huggingface_hub still ships partial stubs

[[tool.mypy.overrides]]
module = ["docker.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "slow: marks tests as slow (run with --runslow)",
  "e2e: end-to-end tests requiring nv8 access",
]

[tool.coverage.run]
source = ["discover", "curator", "heyi_engine", "orchestrator", "cc-agent", "panel", "backup"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
