# discover/whitelist.yaml — HF org whitelist + trending thresholds
#
# Maintained in-repo so changes go through code review.
# Edit this file then `python -m discover.main once` to re-scan.
#
# Last edited: 2026-05-21

tracker:
  # Orgs that publish canonical foundation models or important ones.
  # Order doesn't matter; we scan all of them every round.
  whitelist_orgs:
    # Chinese tech / research:
    - Qwen
    - deepseek-ai
    - MiniMaxAI
    - moonshotai
    - 01-ai
    - baichuan-inc
    - InternLM
    - stepfun-ai
    - bytedance-research
    - bytedance-seed
    - ByteDance-Seed
    - tencent
    - TencentARC
    - Skywork
    - OpenBMB

    # US labs:
    - meta-llama
    - mistralai
    - microsoft
    - google
    - openai-community
    - nvidia
    - allenai
    - HuggingFaceH4
    - HuggingFaceM4
    - HuggingFaceTB

    # EU / image / multimodal:
    - black-forest-labs
    - stabilityai
    - apple
    - briaai
    - kyutai

    # Specialized:
    - facebook
    - lerobot

  # Trending sweep — catch breakouts not in whitelist.
  # Either threshold passes admits the model.
  # PR#53: lowered from 100k/200 → 5k/30 to match the user's intent of
  # "daily hot models" rather than only mega-viral ones. With
  # ``trending_sweep_limit`` low (40) and the recency window applied,
  # the threshold gates noise, not legitimate new releases.
  min_downloads_30d: 5000
  min_likes: 30

  # PR#53: trending sweep only considers models touched in the last N
  # days. Without this the "trending" list was dominated by the same
  # ancient bert/llama-2 checkpoints day after day.
  min_trending_recency_days: 14

  # Only consider models with last_modified ≥ this date.
  # Bumped to 2026 — we don't care about older models for v9.
  from_date: "2026-01-01T00:00:00Z"

  # Modality filter (HF's pipeline_tag). If a model has no tag we let it
  # through; engine_select downstream can refuse if it really can't handle it.
  modality_pipeline_tags:
    - text-generation
    - image-text-to-text
    - text-to-image
    - text-to-video
    - image-to-text
    - any-to-any
    - automatic-speech-recognition
    - text-to-speech
    - video-to-text

  # Caps to keep one round bounded (don't hammer hf-mirror.com).
  # PR#53: user requested "基模厂商发的 + 每天热门的几个模型" — narrow,
  # high-signal, daily-incremental. Old defaults (50 per org × 35 orgs
  # + 200 trending) plus the 557k 2026 backfill blew the panel up.
  per_org_limit: 30
  trending_sweep_limit: 40
